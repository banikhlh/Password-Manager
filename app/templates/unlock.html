{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-4">
        <h2>Разблокировка</h2>
        <p>Введите мастер-пароль для доступа к хранилищу.</p>
        <form method="post">
            <div class="mb-3">
                <label>Мастер-пароль</label>
                <input type="password" name="password" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-primary">Разблокировать</button>
        </form>
    </div>
</div>
{% endblock %}
